name: APEX-SRE-Bench CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build Go Services & Run Evaluator Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Go Service Build
        run: |
          go mod download
          go build -v ./...

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v --durations=10

      - name: Run APEX Mock Replay Baseline
        run: |
          python -m agent.eval_runner --scenario all --mode mock --output results/ci_baseline_run.json

      - name: Verify Mercor Harbor Stirrup Runner
        run: |
          python -m adapters.stirrup_adapter --scenario scenario_1_goroutine_deadlock --mode expert

      - name: Verify APEX RL Trajectory Exporter
        run: |
          python -m agent.eval_runner --scenario scenario_1_goroutine_deadlock --mode mock --export-skyrl results/traces/ci_test_trace.jsonl

  e2e-docker:
    name: End-to-End Live Docker Compose Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Multi-Container Topology via Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for API Gateway & Prometheus Health
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/healthz | grep -q "UP"; then
              echo "API Gateway is healthy!"
              break
            fi
            echo "Waiting for API Gateway ($i/30)..."
            sleep 2
          done
          curl -s http://localhost:8080/healthz

      - name: Verify Live Prometheus Metrics Exporter
        run: |
          echo "Checking Prometheus metrics endpoint on port 2112..."
          curl -s http://localhost:2112/metrics | grep -E "(active_goroutines|http_requests_total)"

      - name: Run Synthetic Production Traffic Generation
        run: |
          python -m traffic.load_generator --url http://localhost:8080 --rps 50 --duration 10

      - name: Verify Live Telemetry Under Load
        run: |
          echo "Scraping live gateway metrics after load generation..."
          curl -s http://localhost:2112/metrics | grep -E "http_requests_total"

      - name: Teardown Docker Compose Topology
        if: always()
        run: |
          docker compose down -v
